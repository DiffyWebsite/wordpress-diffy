name: Deploy to WordPress.org

# Push a tag that matches the "Stable tag" in readme.txt (for example "1.0.0", without a "v")
# and this workflow publishes that version to https://wordpress.org/plugins/diffy/.
#
# The SVN credentials are not in this file. ${{ secrets.* }} only names the encrypted
# repository secrets (Settings -> Secrets and variables -> Actions). GitHub does not pass
# them to workflows run from forks or pull requests, and this workflow only runs when
# someone with write access pushes a version tag.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

# The job needs no write access to the GitHub repository itself.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy tag to WordPress.org
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a commit so a changed tag or branch can't run new code with the secrets.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check that the tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME}"
          grep -qF "Stable tag: ${TAG}" readme.txt || { echo "readme.txt Stable tag is not ${TAG}"; exit 1; }
          grep -qE "Version: +${TAG//./\\.}$" wordpress-diffy.php || { echo "Plugin header Version is not ${TAG}"; exit 1; }

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: diffy
